[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketlab"
version = "0.1.0"
description = "Prospective, reproducible research platform for studying decision-making LLM agents in a virtual multi-asset market environment"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Noah Gallusser" }]
keywords = [
    "large-language-models",
    "agents",
    "forecasting",
    "calibration",
    "reproducibility",
    "pre-registration",
    "virtual-market",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.7",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "typer>=0.12",
    "rich>=13.7",
    "jinja2>=3.1.4",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tenacity>=8.3",
    "numpy>=1.26",
    "scipy>=1.13",
]

[project.optional-dependencies]
# Analytical derivatives (§24.3): rebuildable from the append-only source of truth.
analysis = [
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "pandas>=2.2",
    "matplotlib>=3.8",
]
# Real-data adapters (Phase 3). Kept out of the core so the synthetic vertical
# slice stays fast and dependency-light (§34.3, §34.4).
real-data = [
    "exchange-calendars>=4.5",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    # Upper bound: mypy 1.21+ depends on ast-serialize, which currently ships
    # cp314-only wheels and cannot be installed on the pinned Python 3.12.
    "mypy>=1.10,<1.21",
    "types-pyyaml>=6.0",
]

[project.scripts]
marketlab = "marketlab.cli.main:app"

[project.urls]
Homepage = "https://github.com/zolaski333/marketlab"
Repository = "https://github.com/zolaski333/marketlab"
Issues = "https://github.com/zolaski333/marketlab/issues"
Roadmap = "https://github.com/zolaski333/marketlab/blob/main/docs/ROADMAP.md"
"Pre-registration" = "https://github.com/zolaski333/marketlab/blob/main/docs/PRE_REGISTRATION.md"

[tool.hatch.build.targets.wheel]
packages = ["src/marketlab"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "RUF",    # ruff-specific
    "ANN",    # annotations
    "TID",    # tidy imports
]
ignore = [
    "ANN401",  # allow Any where genuinely dynamic (canonical JSON boundary)
]

[tool.ruff.lint.per-file-ignores]
# SIM117: nested `with` blocks read better in tests, where the outer context
# (append-only lifted) and the inner one (the offending statement) are separate
# ideas that deserve separate lines.
"tests/**" = ["ANN201", "ANN001", "SIM117"]

[tool.ruff.lint.isort]
known-first-party = ["marketlab"]

# ---------------------------------------------------------------------------
# mypy — strict on the scientific core
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
show_error_codes = true
ignore_missing_imports = true
mypy_path = "src"
packages = ["marketlab"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: tests that run a multi-cycle study end to end",
]
filterwarnings = ["error"]
